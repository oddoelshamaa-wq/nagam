<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحذير أمني: نغم فقط!</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Courier+Prime&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: 'Cairo', sans-serif; color: #0f0; }

        /* الخدعة 1: شاشة البصمة */
        #fingerprint-screen {
            position: fixed; inset: 0; z-index: 1000; background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .scanner {
            width: 120px; height: 120px; border: 2px solid #0f0; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 50px;
            position: relative; cursor: pointer; box-shadow: 0 0 20px #0f0;
        }
        .scanner::after {
            content: ""; position: absolute; width: 100%; height: 2px; background: #0f0;
            top: 0; animation: scan 2s infinite;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        /* الخدعة 2: شاشة الهاكر */
        #hacker-screen {
            display: none; position: fixed; inset: 0; z-index: 900; background: #000;
            padding: 20px; font-family: 'Courier Prime', monospace; font-size: 14px;
        }

        /* المحتوى الرئيسي (3D) */
        #main-content {
            display: none; position: fixed; inset: 0; z-index: 800;
            background: radial-gradient(circle, #2b001d, #000);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; transition: 2s;
        }

        .photo-3d {
            width: 200px; height: 200px; position: relative; transform-style: preserve-3d;
            animation: rotate 10s infinite linear; margin-bottom: 30px;
        }
        .photo-3d img {
            width: 100%; height: 100%; border-radius: 20px;
            box-shadow: 0 0 30px #ff4d6d; border: 3px solid #ff4d6d;
        }
        @keyframes rotate { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }

        .glass-card {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
            border-radius: 20px; padding: 25px; width: 90%; text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2); color: white;
        }

        .btns { display: flex; justify-content: center; gap: 20px; margin-top: 20px; position: relative; height: 50px; }
        .btn { padding: 10px 30px; border-radius: 25px; border: none; font-weight: bold; cursor: pointer; }
        #yesBtn { background: #ff4d6d; color: white; }
        #noBtn { background: #555; color: white; position: absolute; }

        /* الرسائل المنبثقة للخدعة */
        #fake-alert {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; color: black; padding: 20px; border-radius: 10px; z-index: 2000;
            text-align: center; box-shadow: 0 0 100px rgba(0,0,0,0.5); width: 80%;
        }
    </style>
</head>
<body>

    <!-- خدعة 1: البصمة -->
    <div id="fingerprint-screen">
        <div class="scanner" id="scanBtn">☝️</div>
        <p>مطلوب بصمة "نغم" لفك التشفير</p>
    </div>

    <!-- خدعة 2: الهاكر -->
    <div id="hacker-screen" id="hackerText"></div>

    <!-- المحتوى الرئيسي -->
    <div id="main-content">
        <div class="photo-3d">
            <img src="e9bdcd17-b3b6-42ae-8353-56f52f195e96.jpg" alt="نغم">
        </div>
        <div class="glass-card">
            <h1 style="color:#ff4d6d">يا نغم ❤️</h1>
            <p>تم اختراق نظام قلبي بنجاح.. والنتيجة طالعة إنك "وحشاني جداً".</p>
            <p>أنا آسف.. ممكن نرجع نغمة حياتنا زي الأول؟</p>
            <div class="btns">
                <button class="btn" id="yesBtn" onclick="finalCelebrate()">نعم</button>
                <button class="btn" id="noBtn" onmouseover="moveNo()" onclick="moveNo()">لأ</button>
            </div>
        </div>
    </div>

    <!-- تنبيه الخدعة -->
    <div id="fake-alert">
        <p id="alertMsg">خطأ في النظام: لا يمكن الضغط على هذا الزر!</p>
        <button onclick="closeAlert()">حاول مرة أخرى</button>
    </div>

    <audio id="music" loop><source src="song.mp3" type="audio/mpeg"></audio>

    <script>
        const scanBtn = document.getElementById('scanBtn');
        const hackerScreen = document.getElementById('hacker-screen');
        const mainContent = document.getElementById('main-content');
        const music = document.getElementById('music');

        // 1. تشغيل البصمة
        scanBtn.addEventListener('touchstart', startScan);
        scanBtn.addEventListener('mousedown', startScan);

        function startScan() {
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            scanBtn.style.boxShadow = "0 0 50px #ff0000";
            
            setTimeout(() => {
                document.getElementById('fingerprint-screen').style.display = 'none';
                hackerScreen.style.display = 'block';
                runHackerEffect();
                music.play();
            }, 2000);
        }

        // 2. تأثير الهاكر
        function runHackerEffect() {
            const text = [
                "> جاري البحث عن مستخدم باسم نغم...",
                "> تم العثور على 'نغم' في مركز القلب.",
                "> تحليل المشاعر: حزن + زعل.",
                "> جاري مسح الزعل...",
                "> تحميل ذكريات image.jpg...",
                "> نغم هي أجمل بنت في العالم: حقيقة مؤكدة.",
                "> جاري فتح رسالة الاعتذار..."
            ];
            let i = 0;
            const interval = setInterval(() => {
                hackerScreen.innerHTML += text[i] + "<br>";
                i++;
                if (i >= text.length) {
                    clearInterval(interval);
                    setTimeout(() => {
                        hackerScreen.style.display = 'none';
                        mainContent.style.display = 'flex';
                        setTimeout(() => mainContent.style.opacity = "1", 100);
                    }, 1500);
                }
            }, 800);
        }

        // 3. خدعة زر "لأ"
        function moveNo() {
            const btn = document.getElementById('noBtn');
            // تحريك عشوائي
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            btn.style.position = "fixed";
            btn.style.left = x + "px";
            btn.style.top = y + "px";

            // خدعة إضافية: لو لمسته بالصدفة
            if(Math.random() > 0.7) {
                document.getElementById('fake-alert').style.display = 'block';
            }
        }

        function closeAlert() {
            document.getElementById('fake-alert').style.display = 'none';
        }

        function finalCelebrate() {
            alert("أحلى نعم من أحلى نغم! ❤️");
            location.reload(); // أو أي حركة تانية
        }
    </script>
</body>
</html>
