<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحذير: عطل في النظام!</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; font-family: 'Cairo', sans-serif; overflow: hidden; color: #fff; }

        /* شاشة الخدعة (Error) */
        #error-screen {
            position: fixed; inset: 0; background: #000; z-index: 2000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; text-align: left; font-family: 'Courier New', monospace;
        }
        .code-line { color: #ff0000; font-size: 12px; width: 100%; margin-bottom: 5px; opacity: 0; animation: fadeIn 0.1s forwards; }
        @keyframes fadeIn { to { opacity: 1; } }

        #fix-btn {
            margin-top: 30px; padding: 15px 30px; background: #ff0000; color: white;
            border: none; border-radius: 5px; font-weight: bold; display: none;
            box-shadow: 0 0 20px #ff0000; cursor: pointer;
        }

        /* العالم الـ 3D */
        #galaxy-world {
            display: none; position: fixed; inset: 0; z-index: 1000;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
            opacity: 0; transition: opacity 2s;
        }

        /* الكريستالة الـ 3D */
        .crystal-container {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            perspective: 1000px; width: 200px; height: 250px;
        }
        .crystal {
            width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
            animation: spin 8s infinite linear;
        }
        .crystal-face {
            position: absolute; width: 200px; height: 250px; 
            background: rgba(255, 77, 109, 0.3);
            border: 2px solid #ff4d6d; backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
        }
        .crystal-face img { width: 90%; height: 90%; object-fit: cover; border-radius: 10px; }
        
        @keyframes spin { 0% { transform: rotateY(0deg) rotateX(10deg); } 100% { transform: rotateY(360deg) rotateX(10deg); } }

        /* الأزرار العائمة */
        .ui-panel {
            position: absolute; bottom: 50px; width: 100%; text-align: center; z-index: 1500;
        }
        .glass-btn {
            padding: 12px 40px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.1); color: white; font-size: 1.2rem;
            backdrop-filter: blur(10px); cursor: pointer; transition: 0.3s; margin: 0 10px;
        }
        #noBtn { position: absolute; transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        /* رسالة كشف الكذب */
        #lie-detector {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #fff; color: #000; padding: 25px; border-radius: 20px;
            z-index: 3000; text-align: center; width: 80%; border: 5px solid #ff0000;
        }
    </style>
</head>
<body>

    <!-- خدعة 1: شاشة العطل -->
    <div id="error-screen">
        <div id="code-box"></div>
        <button id="fix-btn" onclick="repairSystem()">إصلاح النظام (مطلوب نغم)</button>
    </div>

    <!-- خدعة 2: عالم نغم الـ 3D -->
    <div id="galaxy-world">
        <div class="crystal-container">
            <div class="crystal">
                <div class="crystal-face" style="transform: translateZ(20px);"><img src="e9bdcd17-b3b6-42ae-8353-56f52f195e96.jpg"></div>
                <div class="crystal-face" style="transform: rotateY(180deg) translateZ(20px);"><img src="Screenshot 2026-04-28 132313.jpg"></div>
            </div>
        </div>
        
        <div class="ui-panel">
            <h2 style="color: #ff4d6d; text-shadow: 0 0 15px #ff4d6d;">يا نغم، انتِ اللحن اللي مبيخلصش ❤️</h2>
            <p>ممكن نسامح ونرجع؟</p>
            <div style="height: 60px; position: relative;">
                <button class="glass-btn" onclick="celebrate()">نعم</button>
                <button class="glass-btn" id="noBtn" onclick="triggerLie()">لأ</button>
            </div>
        </div>
    </div>

    <!-- خدعة 3: جهاز كشف الكذب -->
    <div id="lie-detector">
        <h1 style="margin:0">❌ خطأ!</h1>
        <p style="font-size: 1.2rem;">جهاز كشف الكذب بيقول إن قلبك عايز يقول "نعم".. <br> بلاش عند يا نغم ❤️</p>
        <button onclick="closeLie()" style="padding: 10px 20px;">هرجع أقول نعم خلاص</button>
    </div>

    <audio id="bgMusic" loop><source src="song.mp3" type="audio/mpeg"></audio>

    <script>
        // 1. تشغيل الأكواد المزيفة
        const codeBox = document.getElementById('code-box');
        const lines = [
            "Initializing Error Log...", "System Overload: Reason(Nagham Love)", 
            "Searching for solution...", "Apology.exe not found", 
            "Hacking Nagham's Heart...", "Access Denied: High Sadness Levels",
            "CRITICAL: System will shutdown in 3 seconds...",
            "REPAIRING: Only Nagham can fix this..."
        ];

        let lineIdx = 0;
        const interval = setInterval(() => {
            const div = document.createElement('div');
            div.className = 'code-line';
            div.innerText = lines[lineIdx];
            codeBox.appendChild(div);
            lineIdx++;
            if(lineIdx >= lines.length) {
                clearInterval(interval);
                document.getElementById('fix-btn').style.display = 'block';
            }
        }, 600);

        // 2. إصلاح النظام
        function repairSystem() {
            document.getElementById('error-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('error-screen').style.display = 'none';
                const world = document.getElementById('galaxy-world');
                world.style.display = 'block';
                setTimeout(() => world.style.opacity = '1', 100);
                document.getElementById('bgMusic').play();
            }, 1000);
        }

        // 3. خدعة زرار "لأ" الهروب وكشف الكذب
        const noBtn = document.getElementById('noBtn');
        noBtn.addEventListener('mouseover', moveBtn);
        noBtn.addEventListener('touchstart', moveBtn);

        function moveBtn() {
            const x = Math.random() * (window.innerWidth - 120);
            const y = Math.random() * (window.innerHeight - 150);
            noBtn.style.left = x + 'px';
            noBtn.style.top = (y - 400) + 'px'; // يتحرك بعيداً عن منطقة الأزرار
        }

        function triggerLie() {
            if (navigator.vibrate) navigator.vibrate(500); // هز الموبايل
            document.getElementById('lie-detector').style.display = 'block';
        }

        function closeLie() {
            document.getElementById('lie-detector').style.display = 'none';
        }

        function celebrate() {
            alert("أحلى نغم في الدنيا رجعت تنور حياتي! ❤️");
            // هنا ممكن تفتح صفحة تانية أو يظهر قلوب مالية الشاشة
        }
    </script>
</body>
</html>
